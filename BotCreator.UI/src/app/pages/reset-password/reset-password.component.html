<tc-card [title]="'register.register'|translate">
    <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword(resetPasswordForm.valid)" novalidate>

        <tc-form-group>
            <div class="row align-items-center">
                <div class="col-12 col-md-4 text-md-right">
                    <tc-form-label class="mb-md-0" [tcColor]="'#e24d4d'"
                        *ngIf="resetPasswordForm.controls.password.touched && resetPasswordForm.controls.password.invalid">
                        {{'password.password'|translate}} <sup [tcColor]="'#e24d4d'">*</sup>:</tc-form-label>

                    <tc-form-label class="mb-md-0"
                        *ngIf="!(resetPasswordForm.controls.password.touched && resetPasswordForm.controls.password.invalid)">
                        {{'password.password'|translate}} <sup [tcColor]="'#e24d4d'">*</sup>:</tc-form-label>
                </div>

                <div class="col-12 col-md-8">
                    <tc-input id="password" [type]="'password'" [prefixIcon]="'icofont-key'" formControlName="password">
                    </tc-input>
                </div>
            </div>
        </tc-form-group>

        <tc-form-group>
            <div class="row align-items-center">
                <div class="col-12 col-md-4 text-md-right">
                    <tc-form-label class="mb-md-0" [tcColor]="'#e24d4d'"
                        *ngIf="resetPasswordForm.controls.confirmPassword.touched && resetPasswordForm.controls.confirmPassword.invalid">
                        {{'password.confirmPassword'|translate}} <sup [tcColor]="'#e24d4d'">*</sup>:</tc-form-label>

                    <tc-form-label class="mb-md-0"
                        *ngIf="!(resetPasswordForm.controls.confirmPassword.touched && resetPasswordForm.controls.confirmPassword.invalid)">
                        {{'password.confirmPassword'|translate}} <sup [tcColor]="'#e24d4d'">*</sup>:</tc-form-label>
                </div>

                <div class="col-12 col-md-8">
                    <tc-input id="confirmPassword" [type]="'password'" [prefixIcon]="'icofont-key'"
                        formControlName="confirmPassword">
                    </tc-input>
                </div>
            </div>
        </tc-form-group>

        <button tc-button [block]="true" [view]="'info'" [beforeIcon]="'icofont-location-arrow'"
            [load]="resetPasswordFormLoading" [disabled]="resetPasswordForm.invalid">
            {{'password.setPassword'|translate}}
        </button>
    </form>
</tc-card>

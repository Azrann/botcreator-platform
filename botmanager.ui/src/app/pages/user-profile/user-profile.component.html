<div class="col-md-8">
   
        <tc-card [title]="'Account Information'">
            <div class="contact">
                <div class="img-section">

                    <h3 class="contact-name">{{ contact.name }}</h3>
                </div>

                <div class="contact-item">
                    <span>Phone:</span>
                    <span></span>
                </div>
                <div class="contact-item">
                    <span>Email:</span>
                    <span><a href="#">{{ contact.email }}</a></span>
                </div>
                <div class="contact-item">
                    <span>Subscription:</span>
                    <span>{{ contact.subscription }}</span>
                </div>
            </div>
        </tc-card>

</div>

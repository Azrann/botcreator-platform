<tc-card [title]="'password.forgot'|translate">
    <form [formGroup]="forgotForm" (ngSubmit)="forgotPassword(forgotForm.valid)" novalidate>

        <tc-form-group>
            <div class="row align-items-center">
                <div class="col-12 col-md-4 text-md-right">
                    <tc-form-label class="mb-md-0" [tcColor]="'#e24d4d'"
                        *ngIf="forgotForm.controls.email.touched && forgotForm.controls.email.invalid">
                        {{'register.email'|translate}} <sup [tcColor]="'#e24d4d'">*</sup>:</tc-form-label>

                    <tc-form-label class="mb-md-0"
                        *ngIf="!(forgotForm.controls.email.touched && forgotForm.controls.email.invalid)">
                        {{'register.email'|translate}}
                        <sup [tcColor]="'#e24d4d'">*</sup>:</tc-form-label>
                </div>

                <div class="col-12 col-md-8">
                    <tc-input [type]="'email'" [prefixIcon]="'icofont-at'" formControlName="email"></tc-input>
                </div>
            </div>
        </tc-form-group>

        <button tc-button [block]="true" [view]="'info'" [beforeIcon]="'icofont-location-arrow'"
            [disabled]="forgotForm.invalid" [load]="loadingForgotForm" class="forgot__reset__button">
            {{'password.reset'|translate}}
        </button>
    </form>
</tc-card>
